name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The committed .npmrc points at Walmart's internal Artifactory mirror and
      # routes all npm traffic through a corporate-only proxy (sysproxy.wal-mart.com)
      # — neither is reachable from GitHub's public-internet-hosted runners, which
      # caused npm ci to hang and crash ("Exit handler never called!"). Override
      # both to the public registry with no proxy for this step; package-lock.json
      # has been regenerated so its "resolved" URLs point at registry.npmjs.org too
      # (npm ci fetches from the lockfile's resolved URLs regardless of registry
      # config, so both changes are required together).
      #
      # --ignore-scripts: the "postinstall" script downloads a Playwright/Chromium
      # browser used only for local dev-time testing — not needed for a static build.
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org/ --proxy=null --https-proxy=null
      - run: npm run build
        env:
          NODE_ENV: production
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
